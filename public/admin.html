<!DOCTYPE html><html lang="tm"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin_page_title">СФЕРА — Administrasiýa paneli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

    <!-- Проверка авторизации и Глобальный переводчик -->
    <script src="/js/auth-check.js"></script>
    <script src="/scripts/auto_translate_i18n.js"></script>

    <style>
        /* ==========================================================================
           1. ЦВЕТОВАЯ ПАЛИТРА (ИЗ INDEX.HTML)
           ========================================================================== */
        :root {
            --primary: #00d4ff;
            --secondary: #1f6bff;
            --accent: #00ffa3;
            --dark-bg: #03080e;
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(0, 212, 255, 0.18);
            --glass-hover-bg: rgba(0, 212, 255, 0.08);
            --glass-hover-border: rgba(0, 212, 255, 0.45);
            --header-footer-bg: rgba(5, 14, 26, 0.75);
            --white: #ffffff;
            --text: #dbe9ff;
            --text-muted: #9bb3cc;
        }

        /* ==========================================================================
           2. ПОЛЗУНОК ПРОКРУТКИ
           ========================================================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #03080e; border-left: 1px solid rgba(0, 212, 255, 0.1); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.4), rgba(31, 107, 255, 0.5));
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #00d4ff, #00ffa3); box-shadow: 0 0 12px rgba(0, 212, 255, 0.8); }

        /* ==========================================================================
           3. ЭФФЕКТЫ СТЕКЛОВИДНОСТИ И ФОН
           ========================================================================== */
        .full-glass-backdrop {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.16), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 163, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(31, 107, 255, 0.1), transparent 60%),
                rgba(3, 8, 14, 0.72);
            backdrop-filter: blur(65px) saturate(180%);
            -webkit-backdrop-filter: blur(65px) saturate(180%);
            pointer-events: none; z-index: 1;
        }

        .bg-grid {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: 0;
        }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; opacity: 0.85; }
        #particles { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 3; }
        .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: floatParticle linear infinite; }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translateY(-10vh) translateX(15px) scale(1.1); opacity: 0; }
        }

        /* ==========================================================================
           4. БАЗОВЫЕ ЭЛЕМЕНТЫ
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; scrollbar-width: thin; scrollbar-color: rgba(0, 212, 255, 0.4) #03080e; }
        html { scroll-behavior: smooth; background-color: var(--dark-bg); }
        body { background-color: var(--dark-bg); color: var(--white); overflow-x: hidden; position: relative; min-height: 100vh; }
        .container { width: min(1400px, 92%); margin: auto; position: relative; z-index: 10; }

        /* --- ШАПКА --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
            backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%);
            background: var(--header-footer-bg); border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5); transition: all 0.4s ease;
            transform: translateZ(0); will-change: transform; contain: layout paint style;
        }
        header .container { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
        
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; transition: transform 0.3s ease; }
        .logo:hover { transform: translateY(-1px) scale(1.02); }
        .logo-icon { width: 54px; height: 54px; display: flex; justify-content: center; align-items: center; }
        .logo-svg { width: 100%; height: 100%; overflow: visible; }
        .logo-svg g { transform-origin: 50px 50px; animation: spinLogo 16s linear infinite; }
        @keyframes spinLogo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .logo-text h2 { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.1; background: linear-gradient(135deg, #ffffff 0%, #00d4ff 50%, #00ffa3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .logo-text p { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; margin: 4px 0 0 0; color: #9fb5c8; text-transform: uppercase; }

        .header-right { display: flex; gap: 12px; align-items: center; }
        .user-info { font-size: 14px; color: var(--text); font-weight: 600; background: rgba(255, 255, 255, 0.04); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(0, 212, 255, 0.15); }
        .lang-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(0, 212, 255, 0.3); color: white; backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; transition: all 0.35s ease; user-select: none; display: inline-flex; align-items: center; justify-content: center; min-width: 54px; }
        .lang-btn:hover { background: rgba(0, 212, 255, 0.2); border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); transform: translateY(-1px); }
        .btn-switch { text-decoration: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--white); backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .btn-switch:hover { background: rgba(0, 212, 255, 0.15); border-color: var(--primary); color: var(--primary); }
        .logout-btn { background: rgba(200, 0, 0, 0.15); border: 1px solid rgba(200, 0, 0, 0.35); color: #ff6b6b; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; }
        .logout-btn:hover { background: rgba(200, 0, 0, 0.3); border-color: #ff6b6b; box-shadow: 0 0 15px rgba(255, 107, 107, 0.3); }

        /* ==========================================================================
           5. СТИЛИ СТРАНИЦЫ
           ========================================================================== */
        .doc-page {
            padding: 120px 7% 40px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .admin-wrapper {
            display: flex;
            gap: 24px;
            flex: 1;
            align-items: flex-start;
        }

        /* --- САЙДБАР --- */
        .admin-sidebar {
            width: 270px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px 16px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            transition: all 0.35s ease;
        }

        .admin-sidebar:hover {
            border-color: var(--glass-hover-border);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.15);
        }

        .admin-sidebar ul { list-style: none; padding: 0; margin: 0; }

        .admin-sidebar li {
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all .25s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .admin-sidebar li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .admin-sidebar li.active {
            background: rgba(0, 212, 255, 0.12);
            color: var(--primary);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.1);
        }

        .admin-sidebar li .icon { font-size: 20px; width: 24px; text-align: center; }

        /* --- КОНТЕНТ --- */
        .admin-content {
            flex: 1;
            min-width: 0;
        }

        .admin-content h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #b4d7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-content .welcome {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ==========================================================================
           6. КАРТОЧКИ И ЭФФЕКТ ПОДСВЕТКИ (SPOTLIGHT) КАК В INDEX.HTML
           ========================================================================== */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Общие стили для карточек */
        .module-card, .admin-card {
            --mouse-x: 50%;
            --mouse-y: 50%;
            position: relative;
            background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(0, 212, 255, 0.15), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            color: white;
            display: block;
        }

        /* Фикс дрожания */
        .module-card > *, .admin-card > * {
            pointer-events: none;
        }

        /* Мощная неоновая подсветка при наведении */
        .module-card:hover, .admin-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4), 
                0 0 30px rgba(0, 212, 255, 0.25),
                inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        /* Специфичные стили для карточек модулей */
        .module-card { text-align: center; }
        
        .module-card .icon { 
            font-size: 40px; 
            margin-bottom: 12px; 
            display: inline-block; 
            transition: all 0.3s ease;
        }
        
        .module-card:hover .icon {
            transform: scale(1.15);
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));
        }

        .module-card h3 { font-size: 18px; margin-bottom: 6px; font-weight: 700; }
        .module-card p { font-size: 13px; color: var(--text-muted); }

        /* Специфичные стили для блоков контента */
        .admin-card { margin-bottom: 24px; }
        .admin-card h3 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }

        /* --- ТАБЛИЦЫ --- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-item:hover {
            background: rgba(0, 212, 255, 0.05);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .stat-item .number { font-size: 26px; font-weight: 800; color: var(--primary); text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
        .stat-item .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .admin-table th {
            text-align: left;
            padding: 12px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }

        .admin-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 14px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge.admin { background: rgba(255, 200, 0, 0.15); color: #ffca28; border: 1px solid rgba(255, 200, 0, 0.3); }
        .badge.user { background: rgba(0, 255, 170, 0.15); color: #00ffa3; border: 1px solid rgba(0, 255, 170, 0.3); }

        .admin-actions button {
            padding: 4px 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
            transition: .2s;
            background: rgba(255,255,255,.1);
            color: white;
            pointer-events: auto;
        }
        .admin-actions button:hover { background: rgba(255,255,255,.2); }
        .admin-actions button.danger { background: rgba(255,77,77,.2); color: #ff6b6b; border: 1px solid rgba(255,77,77,.3); }
        .admin-actions button.danger:hover { background: rgba(255,77,77,.4); color: #fff; }

        /* --- ФУТЕР --- */
        footer { position: relative; z-index: 20; margin-top: 60px; backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); background: var(--header-footer-bg); border-top: 1px solid rgba(0, 212, 255, 0.2); box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.5); }
        footer .container { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; flex-wrap: wrap; gap: 20px; }
        footer p { color: #c0d8f0; font-size: 14px; }

        @media (max-width: 900px) {
            .admin-wrapper { flex-direction: column; }
            .admin-sidebar { width: 100%; position: relative; top: 0; }
            .admin-sidebar ul { display: flex; flex-wrap: wrap; gap: 8px; }
            .admin-sidebar li { margin-bottom: 0; padding: 8px 16px; }
        }

        /* OVERSIGHT STYLES */
        .oversight-container { display: flex; height: calc(100vh - 250px); gap: 16px; margin-top: 20px; }
        .oversight-pane { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
        .oversight-pane:nth-child(1) { flex: 0 0 250px; }
        .oversight-pane:nth-child(2) { flex: 0 0 250px; }
        .pane-header { padding: 12px 16px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); font-size: 14px; }
        .pane-list { flex: 1; overflow-y: auto; padding: 8px; }
        .oversight-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.2s; font-size: 13px; }
        .oversight-item:hover { background: rgba(0, 212, 255, 0.1); }
        .oversight-item.active { background: rgba(0, 212, 255, 0.2); border-left: 2px solid var(--primary); }
        .oversight-msg { margin-bottom: 8px; padding: 10px 14px; border-radius: 12px; font-size: 13px; background: rgba(255,255,255,0.05); max-width: 80%; word-wrap: break-word; }
        .oversight-msg.from-a { align-self: flex-start; background: rgba(0,212,255,0.1); border-bottom-left-radius: 4px; }
        .oversight-msg.from-b { align-self: flex-end; background: rgba(255,255,255,0.08); border-bottom-right-radius: 4px; }
        .oversight-msg-meta { font-size: 10px; color: var(--primary); margin-bottom: 4px; font-weight: 700; }
        .oversight-msg-time { font-size: 10px; opacity: 0.5; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>

    <div class="full-glass-backdrop"></div>
    <div class="bg-grid"></div>
    <canvas id="bgCanvas"></canvas>
    <div id="particles"></div>

    <!-- ШАПКА -->
    <header>
        <div class="container">
            <a href="index.html" class="logo" aria-label="СФЕРА Главная">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">

    <section class="doc-page">
        <div class="container" style="display: flex; flex-direction: column; flex: 1;">
            
            <div class="admin-wrapper">
                <aside class="admin-sidebar">

            <a href="index.html" class="logo">
                <div class="logo-text">
                    <h2 data-i18n="logo_title">СФЕРА</h2>

    <!-- ТВОЯ ЛОГИКА ПЕРЕВОДА И АДМИНКИ -->
    <script>
        // Проверка авторизации
        const token = localStorage.getItem('token') || localStorage.getItem('sfera_token');
        const userRaw = localStorage.getItem('sfera_user') || localStorage.getItem('user');
        const userData = JSON.parse(userRaw || '{}');

        if (!token || userData.role !== 'admin') {
            window.location.href = 'login.html';
        }  

        document.getElementById('adminName').textContent = userData.username || 'Admin';

        // Встроенный резервный словарь
        const fallbackTranslations = {
            tm: {
                logout: "Çykmak", back: "← Yza", welcome: "Hoş geldiňiz, Administrator!", dashboard_welcome: "Platformanyň modullaryna giriş etmek üçin aşakdaky kartlardan saýlaň.",
                menu_dashboard: "Umumy", menu_users: "Ulanyjylar", menu_transactions: "Tranzaksiýalar", menu_listings: "Harytlar", menu_mail: "Poçta", menu_ai: "AI çaklamalar", menu_settings: "Sazlamalar",
                module_marketplace: "Marketpleýs", module_marketplace_desc: "Birža we söwda meýdançasy", module_bank: "TM Bank", module_bank_desc: "Sanly bank hyzmatlary",
                module_messenger: "Messenger", module_messenger_desc: "Çalt habarlaşma", module_mail: "TM Poçta", module_mail_desc: "Içki poçta ulgamy",
                module_ai: "AI analitika", module_ai_desc: "TM Coin prokgnozlary, trendler", module_docs: "Resmiýetler", module_docs_desc: "Awtomatik tassyklama",
                module_tmpay: "TM Pay", module_tmpay_desc: "Milli töleg ulgamy", module_tmcoin: "TM Coin", module_tmcoin_desc: "Sanly döwlet walýutasy"

        function handleMouseMove(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;

        document.addEventListener('DOMContentLoaded', () => {
            const particlesContainer = document.getElementById("particles");
            if (particlesContainer) {
                particlesContainer.innerHTML = "";

                for (let i = 0; i < 65; i++) {
                    const particle = document.createElement("div");
                    particle.className = "particle";
                    const size = Math.random() * 2.2 + 1.0; 
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.width = size + "px";
                    particle.style.height = size + "px";
                    particle.style.backgroundColor = color;
                    particle.style.boxShadow = `0 0 ${size * 3}px ${color}`;
                    particle.style.left = (Math.random() * 92 + 4) + "%";
                    particle.style.top = "0px";
                    particle.style.animationDuration = (10 + Math.random() * 12) + "s";
                    particle.style.animationDelay = (Math.random() * -20) + "s";
                    particlesContainer.appendChild(particle);
                }
            }

            const canvas = document.getElementById('bgCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let w, h;
                function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
                resize();
                window.addEventListener('resize', resize);
                const points = Array.from({ length: 60 }, () => ({
                    x: Math.random() * (w - 45) + 20, y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                    radius: Math.random() * 1.2 + 0.8
                }));
                function drawCanvas() {
                    ctx.clearRect(0, 0, w, h);
                    for (let i = 0; i < points.length; i++) {
                        let p = points[i];
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 20 || p.x > w - 25) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;
                        for (let j = i + 1; j < points.length; j++) {
                            let p2 = points[j];
                            let dx = p.x - p2.x, dy = p.y - p2.y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 180) {
                                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = `rgba(0, 212, 255, ${0.18 * (1 - dist / 180)})`;
                                ctx.lineWidth = 1; ctx.stroke();
                            }
                        }
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 255, 163, 0.85)'; ctx.shadowBlur = 6; ctx.shadowColor = '#00ffa3';
                        ctx.fill(); ctx.shadowBlur = 0;
                    }
                    requestAnimationFrame(drawCanvas);
                }
                drawCanvas();
            }

            // Первичная инициализация языка
            setLanguage(currentLang);

        async function ovFetch(url) {
            const token = localStorage.getItem('token');
            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
            if (!res.ok) throw new Error('API error: ' + res.status);
            return res.json();
        }
        function ovEscape(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function ovFormatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function loadOversightUsers() {

                list.innerHTML = users.map(u => `
                    <div class="oversight-item" onclick="loadOversightDialogs('${u.userId}', '${ovEscape(u.username)}')">
                        <div style="font-weight: 700;">${ovEscape(u.username)} ${u.role === 'admin' ? '🛡' : ''} ${u.online ? '🟢' : ''}</div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">${ovEscape(u.lastText || 'Нет сообщений')}</div>

        }

        async function loadOversightDialogs(userId, username) {
            document.querySelectorAll('#ovUsersList .oversight-item').forEach(el => {

            });
            const list = document.getElementById('ovDialogsList');

            document.getElementById('ovMessagesList').innerHTML = '<div style="padding: 16px; color: var(--text-muted);">Выберите диалог</div>';
            
            try {
                const dialogs = await ovFetch('/api/chat/admin/oversight/users/' + userId + '/dialogs');
                if (!dialogs.length) { list.innerHTML = '<div style="padding: 16px;">Нет диалогов</div>'; return; }
                list.innerHTML = dialogs.map(d => `
                    <div class="oversight-item" onclick="loadOversightMessages('${userId}', '${d.partnerId}', '${ovEscape(username)}', '${ovEscape(d.partnerName)}')">
                        <div style="font-weight: 700;">${ovEscape(d.partnerName)} ${d.partnerRole === 'admin' ? '🛡' : ''}</div>

                    </div>
                `).join('');
            } catch (e) { list.innerHTML = '<div style="padding: 16px; color: #ff4d4d;">' + e.message + '</div>'; }
        }

        async function loadOversightMessages(userA, userB, nameA, nameB) {
            const header = document.getElementById('ovMessagesHeader');
            const list = document.getElementById('ovMessagesList');
            header.textContent = nameA + ' ↔ ' + nameB;
            list.innerHTML = '<div style="padding: 16px; color: var(--text-muted);">Загрузка...</div>';
            
            try {
                const res = await ovFetch('/api/chat/admin/oversight/dialogs/' + userA + '/' + userB + '/messages');
                const msgs = res.messages || [];
                if (!msgs.length) { list.innerHTML = '<div style="padding: 16px;">Нет сообщений</div>'; return; }
                list.innerHTML = msgs.map(m => {
                    const isFromA = String(m.from._id || m.from) === userA;
                    return `
                        <div class="oversight-msg ${isFromA ? 'from-a' : 'from-b'}">
                            <div class="oversight-msg-meta">${ovEscape(m.from.username || 'user')}</div>
                            <div>${ovEscape(m.text)}</div>
                            <div class="oversight-msg-time">${ovFormatTime(m.createdAt)}</div>
                        </div>
                    `;
                }).join('');
                list.scrollTop = list.scrollHeight;
            } catch (e) { list.innerHTML = '<div style="padding: 16px; color: #ff4d4d;">' + e.message + '</div>'; }
        }

    <script id="sfera-escalation-js">
    (function () {
        'use strict';
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function showAdminToast(html) {
            var el = document.createElement('div');
            el.className = 'admin-toast-error';
            el.innerHTML = html;
            document.body.appendChild(el);
            setTimeout(function () { if (el.parentNode) el.remove(); }, 10000);
        }
        function bumpBadge() {
            var li = document.querySelector('li[data-section="oversight"]');
            if (!li) return;
            var badge = li.querySelector('.section-badge.sos');
            if (!badge) { badge = document.createElement('span'); badge.className = 'section-badge sos'; li.appendChild(badge); }
            var cur = parseInt(badge.dataset.count || '0', 10) + 1;
            badge.dataset.count = String(cur);
            badge.textContent = '🆘' + (cur > 1 ? cur : '');
        }
        function clearBadge() {
            var li = document.querySelector('li[data-section="oversight"]');
            if (!li) return;
            var badge = li.querySelector('.section-badge.sos');
            if (badge) { badge.dataset.count = '0'; badge.style.display = 'none'; }
        }
        function bind() {
            if (!window.SferaSocket) return false;
            if (window._sferaEscalationBound) return true;
            window._sferaEscalationBound = true;
            window.SferaSocket.on('ai_escalated', function (data) {
                console.log('[ai_escalated]', data);
                var name = (data && data.username) || 'User';
                showAdminToast('🆘 <b>' + esc(name) + '</b> просит помощи в AI <a href="/messenger.html">Открыть →</a>');
                bumpBadge();
            });
            var oversightLi = document.querySelector('li[data-section="oversight"]');
            if (oversightLi && !oversightLi.dataset.sosBound) {
                oversightLi.dataset.sosBound = '1';
                oversightLi.addEventListener('click', clearBadge);
            }
            console.log('✅ [admin] ai_escalated listener bound');
            return true;
        }
        if (!bind()) {
            var attempts = 0;
            var poll = setInterval(function () { attempts++; if (bind() || attempts > 40) clearInterval(poll); }, 250);
        }
    })();
    </script>
