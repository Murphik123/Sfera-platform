<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СФЕРА — Administrasiýa paneli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Исправленный относительный путь к CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
        :root {
            /* color-scheme: light; */
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(0,212,255,0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0,255,170,0.16), transparent 28%),
                linear-gradient(135deg, #0b111e 0%, #0f172a 40%, #080d1a 100%);
            color: #e2e8f0;
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            padding: 100px 20px 40px;
            gap: 22px;
            box-sizing: border-box;
        }

        .admin-sidebar {
            width: 270px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 22px 18px;
            flex-shrink: 0;
            height: fit-content;
            position: sticky;
            top: 96px;
            overflow: hidden;
            z-index: 10;
        }

        .admin-sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            pointer-events: none;
        }

        .admin-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .admin-sidebar li {
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all .25s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .admin-sidebar li:hover {
            transform: translateY(-2px);
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0,212,255,0.3);
            color: #00d4ff;
        }

        .admin-sidebar li.active {
            background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(15,23,42,0.8));
            color: #00d4ff;
            box-shadow: 0 16px 30px rgba(0,212,255,0.2);
            border-color: rgba(0,212,255,0.4);
        }

        .admin-sidebar li .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .admin-content {
            flex: 1;
            padding: 8px 4px 8px 0;
            overflow-y: auto;
            position: relative;
            z-index: 2;
        }

        .admin-content h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 0 0 12px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .admin-content .welcome {
            font-size: 16px;
            color: #94a3b8;
            margin: 0 0 28px;
            max-width: 760px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .module-card {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
            transition: all .3s ease;
            text-decoration: none;
            color: #f1f5f9;
            display: block;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .module-card::after {
            content: '';
            position: absolute;
            inset: auto -20% -40% 50%;
            width: 220px;
            height: 220px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(0,212,255,0.14), transparent 65%);
            pointer-events: none;
        }

        .module-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0,212,255,0.4);
            box-shadow: 0 24px 48px rgba(0, 212, 255, 0.15);
        }

        .module-card .icon {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .module-card h3 {
            font-size: 20px;
            margin: 0 0 8px;
            color: #ffffff;
        }

        .module-card p {
            font-size: 14px;
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }

        .admin-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 22px 24px;
            margin-bottom: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }

        .admin-card h3 {
            font-size: 18px;
            margin: 0 0 14px;
            color: #ffffff;
        }

        .admin-card .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .admin-card .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .admin-card .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: #00d4ff;
        }

        .admin-card .stat-item .label {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .admin-table th {
            text-align: left;
            padding: 10px 12px;
            color: #94a3b8;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        .admin-table .badge {
            background: rgba(0,212,255,0.14);
            color: #00d4ff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .admin-table .badge.admin {
            background: rgba(255,200,0,0.16);
            color: #ffca28;
        }

        .admin-table .badge.user {
            background: rgba(0,255,170,0.12);
            color: #00ffa3;
        }

        .logout-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
            margin-left: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .logout-btn:hover {
            background: rgba(255,0,0,0.2);
            border-color: rgba(255,0,0,0.4);
            color: #ff6b6b;
        }

        #particles {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            opacity: .55;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: .65; }
            80% { opacity: .65; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }

        @media (max-width: 768px) {
            .admin-wrapper { flex-direction: column; padding: 94px 16px 30px; }
            .admin-sidebar {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                border-radius: 22px;
                padding: 14px 12px;
            }
            .admin-sidebar ul {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .admin-sidebar li {
                padding: 8px 12px;
                font-size: 14px;
            }
            .admin-content { padding: 6px 0 0; }
            .modules-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3" />
                                <stop offset="50%" stop-color="#00d4ff" />
                                <stop offset="100%" stop-color="#1f6bff" />
                            </linearGradient>
                            <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15" filter="url(#logoGlow)" />
                        <g filter="url(#logoGlow)">
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4" />
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" />
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff" filter="url(#logoGlow)" />
                        </g>
                    </svg>
                </div>
            </a>

            <div class="header-right" style="display:flex; align-items:center; gap:12px;">
                <span class="user-info">👑 <strong id="adminName" data-i18n="admin_admin">Admin</strong></span>
                <a href="index.html" class="btn btn-outline" data-i18n="back" style="padding:8px 16px; font-size:13px; background:transparent; border:1px solid rgba(255,255,255,.15); color:white; border-radius:12px; text-decoration:none;">← Yza</a>
                <button class="lang" id="langBtn">TM</button>
                <button class="logout-btn" id="logoutBtn" data-i18n="logout">Çykmak</button>
            </div>
        </div>
    </header>

    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <ul id="adminMenu">
                <li class="active" data-section="dashboard"><span class="icon">📊</span> <span data-i18n="menu_dashboard">Umumy</span></li>
                <li data-section="users"><span class="icon">👥</span> <span data-i18n="menu_users">Ulanyjylar</span></li>
                <li data-section="transactions"><span class="icon">💰</span> <span data-i18n="menu_transactions">Tranzaksiýalar</span></li>
                <li data-section="listings"><span class="icon">🛒</span> <span data-i18n="menu_listings">Harytlar</span></li>
                <li data-section="mail"><span class="icon">📬</span> <span data-i18n="menu_mail">Poçta</span></li>
                <li data-section="ai"><span class="icon">🤖</span> <span data-i18n="menu_ai">AI çaklamalar</span></li>
                <li data-section="settings"><span class="icon">⚙️</span> <span data-i18n="menu_settings">Sazlamalar</span></li>
            </ul>
        </aside>

        <main class="admin-content" id="adminContent">
            <!-- Динамический контент -->
        </main>
    </div>

    <script>
        // Проверка авторизации
        const token = localStorage.getItem('token');
        const userData = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || userData.role !== 'admin') {
            window.location.href = 'login.html';
        }

        // Встроенный резервный словарь на случай отсутствия ключа в JSON
        const fallbackTranslations = {
            tm: {
                logout: "Çykmak", back: "← Yza", welcome: "Hoş geldiňiz, Administrator!", dashboard_welcome: "Platformanyň modullaryna giriş etmek üçin aşakdaky kartlardan saýlaň.",
                menu_dashboard: "Umumy", menu_users: "Ulanyjylar", menu_transactions: "Tranzaksiýalar", menu_listings: "Harytlar", menu_mail: "Poçta", menu_ai: "AI çaklamalar", menu_settings: "Sazlamalar",
                module_marketplace: "Marketpleýs", module_marketplace_desc: "Birža we söwda meýdançasy", module_bank: "TM Bank", module_bank_desc: "Sanly bank hyzmatlary",
                module_messenger: "Messenger", module_messenger_desc: "Çalt habarlaşma", module_mail: "TM Poçta", module_mail_desc: "Içki poçta ulgamy",
                module_ai: "AI analitika", module_ai_desc: "TM Coin prokgnozlary, trendler", module_docs: "Resmiýetler", module_docs_desc: "Awtomatik tassyklama",
                module_tmpay: "TM Pay", module_tmpay_desc: "Milli töleg ulgamy", module_tmcoin: "TM Coin", module_tmcoin_desc: "Sanly döwlet walýutasy"
            },
            ru: {
                logout: "Выйти", back: "← Назад", welcome: "Добро пожаловать, Администратор!", dashboard_welcome: "Выберите модуль платформы для перехода.",
                menu_dashboard: "Обзор", menu_users: "Пользователи", menu_transactions: "Транзакции", menu_listings: "Объявления", menu_mail: "Почта", menu_ai: "AI прогнозы", menu_settings: "Настройки",
                module_marketplace: "Маркетплейс", module_marketplace_desc: "Биржа и торговая площадка", module_bank: "ТМ Банк", module_bank_desc: "Цифровые банковские услуги",
                module_messenger: "Мессенджер", module_messenger_desc: "Быстрая связь", module_mail: "TM Почта", module_mail_desc: "Внутренняя почта",
                module_ai: "ИИ-аналитика", module_ai_desc: "Прогнозы TM Coin, тренды", module_docs: "Документы", module_docs_desc: "Автоматическая проверка",
                module_tmpay: "TM Pay", module_tmpay_desc: "Национальная платёжная система", module_tmcoin: "TM Coin", module_tmcoin_desc: "Цифровая государственная валюта"
            },
            en: {
                logout: "Logout", back: "← Back", welcome: "Welcome, Administrator!", dashboard_welcome: "Select a platform module to navigate.",
                menu_dashboard: "Dashboard", menu_users: "Users", menu_transactions: "Transactions", menu_listings: "Listings", menu_mail: "Mail", menu_ai: "AI Predictions", menu_settings: "Settings",
                module_marketplace: "Marketplace", module_marketplace_desc: "Exchange and trading platform", module_bank: "TM Bank", module_bank_desc: "Digital banking services",
                module_messenger: "Messenger", module_messenger_desc: "Instant messaging", module_mail: "TM Mail", module_mail_desc: "Internal mail system",
                module_ai: "AI Analytics", module_ai_desc: "TM Coin forecasts, trends", module_docs: "Documents", module_docs_desc: "Automatic verification",
                module_tmpay: "TM Pay", module_tmpay_desc: "National payment system", module_tmcoin: "TM Coin", module_tmcoin_desc: "Digital state currency"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'tm';
        let loadedTranslations = {};

        // Загрузка JSON файла из папки languages/
        async function fetchLanguageFile(lang) {
            try {
                const res = await fetch(`languages/${lang}.json`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                console.warn(`Не удалось загрузить languages/${lang}.json, используется встроенный резерв.`, err);
                return null;
            }
        }

        async function setLanguage(lang) {
            currentLang = lang;
            const externalData = await fetchLanguageFile(lang);
            
            // Объединяем полученный JSON с фоллбеком
            loadedTranslations = Object.assign({}, fallbackTranslations[lang] || {}, externalData || {});

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (loadedTranslations[key]) {
                    el.textContent = loadedTranslations[key];
                }
            });

            document.getElementById('langBtn').textContent = lang.toUpperCase();
            localStorage.setItem('lang', lang);

            const activeLi = document.querySelector('#adminMenu li.active');
            if (activeLi) renderSection(activeLi.dataset.section);
        }

        document.getElementById('langBtn').addEventListener('click', function() {
            const cycle = ['tm', 'ru', 'en'];
            let idx = cycle.indexOf(currentLang);
            idx = (idx + 1) % cycle.length;
            setLanguage(cycle[idx]);
        });

        document.getElementById('adminName').textContent = userData.username || 'Admin';

        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (window.SFERA_LOGOUT) return window.SFERA_LOGOUT();
            localStorage.removeItem('token');
            localStorage.removeItem('sfera_token');
            localStorage.removeItem('user');
            localStorage.removeItem('sfera_user');
            window.location.href = 'login.html';
        });

        // Отрисовка секций
        function renderSection(section) {
            const contentArea = document.getElementById('adminContent');
            const t = loadedTranslations;

            if (section === 'dashboard') {
                contentArea.innerHTML = `
                    <h1 data-i18n="admin_t_welcome_ho_geldi_iz">${t.welcome || 'Hoş geldiňiz!'}</h1>
                    <p class="welcome" data-i18n="admin_t_dashboard_welcome">${t.dashboard_welcome || ''}</p>
                    
                    <div class="modules-grid">
                        <a href="marketplace.html" class="module-card"><div class="icon">🛒</div><h3 data-i18n="admin_t_module_marketplace_marketplace">${t.module_marketplace || 'Marketplace'}</h3><p>${t.module_marketplace_desc || ''}</p></a>
                        <a href="bank.html" class="module-card"><div class="icon">🏦</div><h3>${t.module_bank || 'TM Bank'}</h3><p>${t.module_bank_desc || ''}</p></a>
                        <a href="messenger.html" class="module-card"><div class="icon">💬</div><h3>${t.module_messenger || 'Messenger'}</h3><p>${t.module_messenger_desc || ''}</p></a>
                        <a href="mailtm.html" class="module-card"><div class="icon">✉️</div><h3>${t.module_mail || 'TM Mail'}</h3><p>${t.module_mail_desc || ''}</p></a>
                        <a href="ai.html" class="module-card"><div class="icon">🤖</div><h3>${t.module_ai || 'AI Analytics'}</h3><p>${t.module_ai_desc || ''}</p></a>
                        <a href="documents.html" class="module-card"><div class="icon">📄</div><h3>${t.module_docs || 'Documents'}</h3><p>${t.module_docs_desc || ''}</p></a>
                        <a href="tm-pay.html" class="module-card"><div class="icon">💳</div><h3>${t.module_tmpay || 'TM Pay'}</h3><p>${t.module_tmpay_desc || ''}</p></a>
                        <a href="tm-coin.html" class="module-card"><div class="icon">₮</div><h3>${t.module_tmcoin || 'TM Coin'}</h3><p>${t.module_tmcoin_desc || ''}</p></a>
                    </div>

                    <div class="admin-card">
                        <h3>Platformanyň ýagdaýy</h3>
                        <div class="stat-grid">
                            <div class="stat-item"><div class="number" id="statUsers">0</div><div class="label" data-i18n="admin_ulanyjylar">Ulanyjylar</div></div>
                            <div class="stat-item"><div class="number">24</div><div class="label">Sargytlar</div></div>
                            <div class="stat-item"><div class="number">142</div><div class="label">TM Coin söwdalary</div></div>
                            <div class="stat-item"><div class="number">8</div><div class="label">Hatlar</div></div>
                        </div>
                    </div>

                    <div class="admin-card">
                        <h3>Iň soňky ulanyjylar</h3>
                        <table class="admin-table">
                            <thead><tr><th data-i18n="admin_ulanyjy">Ulanyjy</th><th>Email</th><th>Rol</th><th>Döredilen</th></tr></thead>
                            <tbody id="recentUsersBody"></tbody>
                        </table>
                    </div>
                `;
                loadStats();
            } else if (section === 'users') {
                contentArea.innerHTML = `
                    <h1>${t.menu_users || 'Ulanyjylar'}</h1>
                    <div class="admin-card">
                        <h3>Ulanyjylary dolandyrmak</h3>
                        <table class="admin-table">
                            <thead><tr><th>Ulanyjy</th><th>Email</th><th>Rol</th><th>Hereket</th></tr></thead>
                            <tbody>
                                <tr><td data-i18n="admin_admin">admin</td><td>admin@sfera.tm</td><td><span class="badge admin">admin</span></td><td><div class="admin-actions"><button class="danger">Poz</button></div></td></tr>
                                <tr><td>user1</td><td>user1@sfera.tm</td><td><span class="badge user">user</span></td><td><div class="admin-actions"><button>Üýtget</button><button class="danger">Poz</button></div></td></tr>
                            </tbody>
                        </table>
                    </div>`;
            } else {
                contentArea.innerHTML = `<h1>${t['menu_' + section] || section}</h1><div class="admin-card"><p>Bölüm taýýarlanýar...</p></div>`;
            }
        }

        // Переключение меню
        const menuItems = document.querySelectorAll('#adminMenu li');
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                menuItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                renderSection(this.dataset.section);
            });
        });

        function loadStats() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const statUsersEl = document.getElementById('statUsers');
            if (statUsersEl) statUsersEl.textContent = users.length;

            const tbody = document.getElementById('recentUsersBody');
            if (!tbody) return;
            const recent = users.slice(-5).reverse();
            tbody.innerHTML = recent.map(u => `
                <tr>
                    <td>${u.username || 'N/A'}</td>
                    <td>${u.email || ''}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'admin' : 'user'}">${u.role || 'user'}</span></td>
                    <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : ''}</td>
                </tr>
            `).join('');
        }

        // Частицы
        document.addEventListener('DOMContentLoaded', () => {
            const particles = document.getElementById('particles');
            if (particles && particles.children.length === 0) {
                for (let i = 0; i < 60; i++) {
                    const p = document.createElement('span');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.animationDuration = (6 + Math.random() * 12) + 's';
                    p.style.animationDelay = Math.random() * 5 + 's';
                    particles.appendChild(p);
                }
            }
            setLanguage(currentLang);
        });
    </script>
</body>
</html>
