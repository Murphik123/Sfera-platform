<!DOCTYPE html>
<html lang="tm">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pay_page_title">Sfera — TM Pay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Проверка авторизации и Глобальный переводчик -->
    <script src="/js/auth-check.js"></script>
    <script src="/scripts/auto_translate_i18n.js"></script>
    
    <!-- Chart.js для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* ==========================================================================
           1. ЦВЕТОВАЯ ПАЛРТР А (РЗ INDEX.HTML)
           ========================================================================== */
        :root {
            --primary: #00d4ff;
            --secondary: #1f6bff;
            --accent: #00ffa3;
            --dark-bg: #03080e;
            --glass-bg: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(0, 212, 255, 0.18);
            --glass-hover-bg: rgba(0, 212, 255, 0.08);
            --glass-hover-border: rgba(0, 212, 255, 0.45);
            --header-footer-bg: rgba(5, 14, 26, 0.75);
            --white: #ffffff;
            --text: #dbe9ff;
            --text-muted: #9bb3cc;
            --radius: 22px;
        }

        /* ==========================================================================
           2. ПОЛЗУНОК ПР ОКР УТКР
           ========================================================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #03080e; border-left: 1px solid rgba(0, 212, 255, 0.1); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.4), rgba(31, 107, 255, 0.5));
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #00d4ff, #00ffa3); box-shadow: 0 0 12px rgba(0, 212, 255, 0.8); }

        /* ==========================================================================
           3. Р­ФФЕКТЫ СТЕКЛОВРДНОСТР Р ФОН
           ========================================================================== */
        .full-glass-backdrop {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.16), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 163, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(31, 107, 255, 0.1), transparent 60%),
                rgba(3, 8, 14, 0.72);
            backdrop-filter: blur(65px) saturate(180%);
            -webkit-backdrop-filter: blur(65px) saturate(180%);
            pointer-events: none; z-index: 1;
        }

        .bg-grid {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: 0;
        }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; opacity: 0.85; }
        #particles { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 3; }
        .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: floatParticle linear infinite; }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { transform: translateY(-10vh) translateX(15px) scale(1.1); opacity: 0; }
        }

        /* ==========================================================================
           4. БАЗОВЫЕ Р­ЛЕМЕНТЫ Р ШАПКА
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; scrollbar-width: thin; scrollbar-color: rgba(0, 212, 255, 0.4) #03080e; }
        html { scroll-behavior: smooth; background-color: var(--dark-bg); }
        body { background-color: var(--dark-bg); color: var(--white); overflow-x: hidden; position: relative; min-height: 100vh; }
        .container { width: min(1400px, 92%); margin: auto; position: relative; z-index: 10; }

        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
            backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%);
            background: var(--header-footer-bg); border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5); transition: all 0.4s ease;
            transform: translateZ(0); will-change: transform; contain: layout paint style;
        }
        header .container { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
        
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; transition: transform 0.3s ease; }
        .logo:hover { transform: translateY(-1px) scale(1.02); }
        .logo-icon { width: 54px; height: 54px; display: flex; justify-content: center; align-items: center; }
        .logo-svg { width: 100%; height: 100%; overflow: visible; }
        .logo-svg g { transform-origin: 50px 50px; animation: spinLogo 16s linear infinite; }
        @keyframes spinLogo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .logo-text h2 { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.1; background: linear-gradient(135deg, #ffffff 0%, #00d4ff 50%, #00ffa3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .logo-text p { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; margin: 4px 0 0 0; color: #9fb5c8; text-transform: uppercase; }

        .header-right { display: flex; gap: 12px; align-items: center; }
        .user-info { font-size: 14px; color: var(--text); font-weight: 600; background: rgba(255, 255, 255, 0.04); padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(0, 212, 255, 0.15); }
        .lang-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(0, 212, 255, 0.3); color: white; backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; transition: all 0.35s ease; user-select: none; display: inline-flex; align-items: center; justify-content: center; min-width: 54px; }
        .lang-btn:hover { background: rgba(0, 212, 255, 0.2); border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); transform: translateY(-1px); }
        .btn-switch { text-decoration: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--white); backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .btn-switch:hover { background: rgba(0, 212, 255, 0.15); border-color: var(--primary); color: var(--primary); }
        .logout-btn { background: rgba(200, 0, 0, 0.15); border: 1px solid rgba(200, 0, 0, 0.35); color: #ff6b6b; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s ease; }
        .logout-btn:hover { background: rgba(200, 0, 0, 0.3); border-color: #ff6b6b; box-shadow: 0 0 15px rgba(255, 107, 107, 0.3); }

        /* ==========================================================================
           5. СТРЛР СТР АНРЦЫ (РЗ DOCUMENTS.HTML)
           ========================================================================== */
        .doc-page { padding: 140px 7% 60px; min-height: 100vh; position: relative; z-index: 10; }
        .doc-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px; gap: 16px; }
        .doc-header h1 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, #b4d7ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .doc-header .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

        .btn { padding: 10px 24px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #008cff); color: white; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.25); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0, 212, 255, 0.4); }
        .btn-outline { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(0, 212, 255, 0.2); color: white; }
        .btn-outline:hover { background: rgba(0, 212, 255, 0.1); border-color: #00d4ff; }
        .btn-success { background: linear-gradient(135deg, #00ffa3, #00b894); color: #08131d; font-weight: 700; }
        .btn-success:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0, 255, 170, 0.3); }

        /* Табы */
        .doc-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 1px solid rgba(0, 212, 255, 0.15); padding-bottom: 8px; }
        .doc-tabs button { background: transparent; border: none; color: var(--text-muted); padding: 12px 24px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s ease; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; }
        .doc-tabs button.active { color: #00d4ff; border-bottom-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .doc-tabs button:hover { color: white; }
        
        .tab-content { display: none; animation: fadeUp 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ==========================================================================
           6. КАР ТОЧКР Р ПОДСВЕТКА (SPOTLIGHT)
           ========================================================================== */
        .card-spotlight {
            --mouse-x: 50%;
            --mouse-y: 50%;
            position: relative;
            background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(0, 212, 255, 0.15), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card-spotlight:hover {
            border-color: var(--glass-hover-border);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 212, 255, 0.15);
        }

        /* Фикс дрожания для текста */
        .card-spotlight > div, .card-spotlight > h1, .card-spotlight > p, .card-spotlight > span {
            pointer-events: none;
        }
        /* Р азрешаем клики для интерактивных элементов */
        .card-spotlight input,
        .card-spotlight button,
        .card-spotlight select,
        .card-spotlight textarea,
        .card-spotlight a,
        .card-spotlight .interactive {
            pointer-events: auto;
        }

        /* Конкретные элементы страницы */
        .balance-card {
            padding: 30px 35px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .balance-label { font-size: 16px; color: var(--text-muted); }
        .balance-amount {
            font-size: 48px; font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #00ffa3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.3));
        }
        .balance-currency { font-size: 22px; color: var(--text-muted); margin-left: 8px; }

        .chart-container {
            padding: 20px; margin-bottom: 30px;
            height: 220px;
        }

        .wallet-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px; margin: 20px 0;
        }
        .wallet-item {
            padding: 20px; text-align: center;
        }
        .wallet-item .currency { font-size: 14px; color: #00d4ff; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        .wallet-item .amount { font-size: 24px; font-weight: 800; }

        .transfer-form { max-width: 520px; margin: 0 auto; }
        .transfer-form .form-group { margin-bottom: 20px; }
        .transfer-form .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .transfer-form .form-group input,
        .transfer-form .form-group select,
        .transfer-form .form-group textarea {
            width: 100%; padding: 14px 18px; border-radius: 14px;
            border: 1px solid rgba(0, 212, 255, 0.25);
            background: rgba(3, 8, 14, 0.6);
            color: white; font-size: 15px; transition: .3s; outline: none;
        }
        .transfer-form .form-group input:focus,
        .transfer-form .form-group select:focus,
        .transfer-form .form-group textarea:focus {
            border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,.3);
        }
        .transfer-form .form-group textarea { min-height: 80px; resize: vertical; }
        .transfer-form .form-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

        .transactions-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        .transactions-list li { padding: 16px; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .tx-type { display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-right: 8px; text-transform: uppercase; }
        .tx-type.credit { background: rgba(0,255,170,.15); color: #00ffa3; border: 1px solid rgba(0,255,170,.3); }
        .tx-type.debit { background: rgba(255,0,0,.15); color: #ff6b6b; border: 1px solid rgba(255,0,0,.3); }
        .tx-type.transfer { background: rgba(0,212,255,.15); color: #00d4ff; border: 1px solid rgba(0,212,255,.3); }
        .tx-type.international { background: rgba(255,193,7,.15); color: #ffc107; border: 1px solid rgba(255,193,7,.3); }
        .tx-amount.positive { color: #00ffa3; font-weight: 700; }
        .tx-amount.negative { color: #ff6b6b; font-weight: 700; }
        .tx-date { color: var(--text-muted); font-size: 12px; margin-left: 12px; }
        .tx-description { flex: 1; margin: 0 12px; color: var(--text); }

        .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-bar select { padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(0,212,255,0.25); background: rgba(3,8,14,0.6); color: white; font-size: 14px; outline: none; }

        .qr-container {
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            padding: 30px; margin-top: 16px;
        }
        .qr-container img { border-radius: 12px; background: white; padding: 8px; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        /* Уведомления */
        .toast { position: fixed; bottom: 30px; right: 30px; background: rgba(5, 14, 26, 0.95); border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 16px; padding: 16px 24px; color: white; font-weight: 600; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); z-index: 2000; animation: slideUp 0.3s ease; backdrop-filter: blur(15px); }
        .toast.success { border-left: 5px solid #00ffa3; }
        .toast.error { border-left: 5px solid #ff6b6b; }
        .toast.info { border-left: 5px solid #00d4ff; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ФУТЕР  --- */
        footer { position: relative; z-index: 20; margin-top: 60px; backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); background: var(--header-footer-bg); border-top: 1px solid rgba(0, 212, 255, 0.2); box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.5); }
        footer .container { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; flex-wrap: wrap; gap: 20px; }
        footer p { color: #c0d8f0; font-size: 14px; }

        @media (max-width: 768px) {
            .balance-card .balance-amount { font-size: 32px; }
            .doc-tabs button { padding: 10px 14px; font-size: 13px; }
            .chart-container { height: 180px; }
        }
    </style>
</head>
<body>

    <div class="full-glass-backdrop"></div>
    <div class="bg-grid"></div>
    <canvas id="bgCanvas"></canvas>
    <div id="particles"></div>

    <!-- ЕДРНАЯ Р­ТАЛОННАЯ ШАПКА -->
    <header>
        <div class="container">
            <a href="index.html" class="logo" aria-label="СФЕР А Главная">
                <div class="logo-icon">
                    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00ffa3"/>
                                <stop offset="50%" stop-color="#00d4ff"/>
                                <stop offset="100%" stop-color="#1f6bff"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="28" fill="url(#logoGrad)" opacity="0.15"/>
                        <g>
                            <circle cx="50" cy="50" r="40" stroke="url(#logoGrad)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity="0.4"/>
                            <path d="M50 12 C72 12, 88 28, 88 50 C88 72, 68 88, 46 86 C26 84, 14 66, 16 46 C18 28, 34 16, 52 18 C68 20, 78 34, 76 50 C74 64, 62 74, 48 72 C36 70, 28 58, 30 46 C32 36, 42 28, 52 30 C60 32, 66 40, 64 50 C62 58, 54 62, 46 60" 
                                  stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
                            <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-text">
                    <h2 data-i18n="logo_title">СФЕР А</h2>
                    <p data-i18n="logo_subtitle">Национальная Цифровая Платформа</p>
                </div>
            </a>

            <div class="header-right header-buttons">
                <span class="user-info">рџ‘¤ <strong id="username">User</strong></span>
                <button class="lang-btn" id="langBtn" type="button">TM</button>
                <a href="#" id="backLink" class="btn-switch" data-i18n="btn_back">← Yza</a>
                <button class="logout-btn" id="logoutBtn" data-i18n="btn_logout">рџљЄ Г‡ykmak</button>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <section class="doc-page">
        <div class="container">
            <div class="doc-header">
                <h1 data-i18n="pay_header_title">рџ’і TM Pay</h1>
                <div class="actions">
                    <button class="btn btn-outline" id="refreshBtn" data-i18n="refresh">вџі Täzele</button>
                </div>
            </div>

            <!-- График баланса -->
            <div class="chart-container card-spotlight">
                <canvas id="balanceChart"></canvas>
            </div>

            <!-- Баланс -->
            <div class="balance-card card-spotlight">
                <div>
                    <div class="balance-label" data-i18n="total_balance">Jemi balans</div>
                    <div>
                        <span class="balance-amount" id="totalBalance">0.00</span>
                        <span class="balance-currency">TMT</span>
                    </div>
                </div>
                <div style="text-align:right; font-size:14px; color:#bdd0df;">
                    <span data-i18n="wallet_id">Koşelge ID:</span> <span id="walletId">TM-1234-5678</span>
                </div>
            </div>

            <!-- Мультивалютный кошелёк -->
            <div class="wallet-grid" id="walletGrid"></div>

            <!-- Вкладки -->
            <div class="doc-tabs">
                <button class="active" data-tab="transfer" data-i18n="tab_transfer">Geçiriş</button>
                <button data-tab="international" data-i18n="tab_international">Daşarky</button>
                <button data-tab="history" data-i18n="tab_history">Taryh</button>
                <button data-tab="cards" data-i18n="tab_cards">Kartlar</button>
                <button data-tab="receive" data-i18n="tab_receive">Al</button>
            </div>

            <!-- Вкладка: внутренние переводы -->
            <div class="tab-content active" id="tab-transfer">
                <div class="transfer-form card-spotlight" style="padding: 30px; margin: 0 auto;">
                    <form id="transferForm">
                        <div class="form-group">
                            <label for="transferCurrency" data-i18n="currency">Walýuta</label>
                            <select id="transferCurrency">
                                <option value="TMT">TMT</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="RUB">RUB</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="recipientId" data-i18n="recipient">Alýan (email, telefon ýa-da ID)</label>
                            <input type="text" id="recipientId" placeholder="mysal@mail.com ýa-da +993 63 000000" required />
                        </div>
                        <div class="form-group">
                            <label for="transferAmount" data-i18n="amount">Mukdar</label>
                            <input type="number" id="transferAmount" step="0.01" min="0.01" required placeholder="100.00" />
                        </div>
                        <div class="form-group">
                            <label for="transferDesc" data-i18n="description">Düşündiriş</label>
                            <textarea id="transferDesc" placeholder="Geçiriş sebäbi..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="transferBtn" data-i18n="send">Iber</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Вкладка: международные переводы -->
            <div class="tab-content" id="tab-international">
                <div class="transfer-form card-spotlight" style="padding: 30px; margin: 0 auto;">
                    <form id="internationalForm">
                        <div class="form-group">
                            <label for="intCurrency" data-i18n="currency">Walýuta</label>
                            <select id="intCurrency">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                                <option value="TMT">TMT</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="intCountry" data-i18n="country">Гќurt</label>
                            <input type="text" id="intCountry" placeholder="Türkiýe, ABЕћ, Germaniýa..." required />
                        </div>
                        <div class="form-group">
                            <label for="intBank" data-i18n="bank">Bank</label>
                            <input type="text" id="intBank" placeholder="Bank ady" required />
                        </div>
                        <div class="form-group">
                            <label for="intAccount" data-i18n="account_number">Hasap belgisi (IBAN / SWIFT)</label>
                            <input type="text" id="intAccount" placeholder="IBAN ýa-da SWIFT kody" required />
                        </div>
                        <div class="form-group">
                            <label for="intAmount" data-i18n="amount">Mukdar</label>
                            <input type="number" id="intAmount" step="0.01" min="0.01" required placeholder="100.00" />
                        </div>
                        <div class="form-group">
                            <label for="intDesc" data-i18n="description">Düşündiriş</label>
                            <textarea id="intDesc" placeholder="Geçiriş sebäbi..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="intTransferBtn" data-i18n="send_international">Daşarky geçir</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Вкладка: история -->
            <div class="tab-content" id="tab-history">
                <div class="filter-bar">
                    <label for="txFilter" data-i18n="filter_type">Görnüşi:</label>
                    <select id="txFilter">
                        <option value="all" data-i18n="all">Г„hlisi</option>
                        <option value="credit" data-i18n="filter_credit">Gelen</option>
                        <option value="debit" data-i18n="filter_debit">Г‡ykdajy</option>
                        <option value="transfer" data-i18n="filter_transfer">Geçiriş</option>
                        <option value="international" data-i18n="filter_international">Daşarky</option>
                    </select>
                </div>
                <ul class="transactions-list card-spotlight" id="transactionsList" style="padding: 20px;"></ul>
                <div class="empty-state" id="emptyTx" style="display:none;">
                    <div class="icon">рџ“­</div>
                    <p data-i18n="no_transactions">Hiç hili amal ýok</p>
                </div>
            </div>

            <!-- Вкладка: карты -->
            <div class="tab-content" id="tab-cards">
                <div id="cardsContainer" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:16px;"></div>
                <div style="margin-top:20px;">
                    <button class="btn btn-outline" id="addCardBtn" data-i18n="add_card">+ Täze kart</button>
                </div>
            </div>

            <!-- Вкладка: получение платежей (QR) -->
            <div class="tab-content" id="tab-receive">
                <div class="qr-container card-spotlight" style="margin: 0 auto; max-width: 400px;">
                    <div style="font-size:18px; font-weight:600; margin-bottom:12px;" data-i18n="receive_qr">Töleg almak üçin QR kody</div>
                    <img id="qrCodeImage" src="" alt="QR code" style="width:150px; height:150px;" />
                    <div style="margin-top:12px; color:#00d4ff; word-break:break-all; font-family:monospace;" id="qrDataText">TM-1234-5678</div>
                    <button class="btn btn-outline" id="copyQrDataBtn" style="margin-top:12px;" data-i18n="copy_address">Kopiýa</button>
                </div>
            </div>

        </div>
    </section>

    <!-- ФУТЕР  -->
    <footer>
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-text">
                    <h2 data-i18n="logo_title">СФЕР А</h2>
                    <p data-i18n="logo_subtitle">Национальная Цифровая Платформа</p>
                </div>
            </a>
            <p data-i18n="footer_copy">© 2026 — Единая цифровая платформа Туркменистана</p>
        </div>
    </footer>

    <script>
        // ============================================================
        // 1. РНРЦРАЛРЗАЦРЯ ПЕР ЕВОДЧРКА
        // ============================================================
        if (!localStorage.getItem('sfera_lang') && !localStorage.getItem('lang')) {
            localStorage.setItem('sfera_lang', 'tm');
            localStorage.setItem('lang', 'tm');
        }

        let currentLang = window.SFERA_I18N ? window.SFERA_I18N.getLanguage() : 'tm';

        function tr(key, fallback = '') {
            if (window.SFERA_I18N && window.SFERA_I18N.t) {
                const val = window.SFERA_I18N.t(key);
                if (val !== key) return val;
            }
            return fallback || key;
        }

        window.addEventListener('sfera:languageChanged', (e) => {
            currentLang = e.detail.lang;
            renderWallets();
            renderTransactions();
            renderCards();
            updateQR();
        });

        // ============================================================
        // 2. АВТОР РЗАЦРЯ Р НАВРГАЦРЯ
        // ============================================================
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const user = JSON.parse(localStorage.getItem('user') || '{"username":"User","role":"user"}');
        document.getElementById('username').textContent = user.username || 'User';

        const backLink = document.getElementById('backLink');
        if (backLink) {
            const role = (user && user.role) || (window.SFERA_AUTH && window.SFERA_AUTH.role) || localStorage.getItem('sfera_role') || 'user';
            backLink.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
        }
        
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        // ============================================================
        // 3. ДАННЫЕ (localStorage)
        // ============================================================
        let wallets = [];
        let transactions = [];
        let cards = [];
        let balanceHistory = [];
        let chart = null;

        const WALLETS_KEY = 'tm_pay_wallets';
        const TRANSACTIONS_KEY = 'tm_pay_transactions';
        const CARDS_KEY = 'tm_pay_cards';

        function loadData() {
            const storedWallets = localStorage.getItem(WALLETS_KEY);
            if (storedWallets) { try { wallets = JSON.parse(storedWallets); } catch(e) { wallets = []; } }
            if (!wallets || wallets.length === 0) {
                wallets = [
                    { currency: 'TMT', balance: 12500.75 },
                    { currency: 'USD', balance: 500.50 },
                    { currency: 'EUR', balance: 320.00 },
                    { currency: 'RUB', balance: 15000.00 }
                ];
                saveWallets();
            }

            const storedTx = localStorage.getItem(TRANSACTIONS_KEY);
            if (storedTx) { try { transactions = JSON.parse(storedTx); } catch(e) { transactions = []; } }
            if (!transactions || transactions.length === 0) {
                transactions = [
                    { id: 'tx1', type: 'transfer', from: 'TMT', to: 'USD', amount: 200, description: 'Aýlyk geçiriş', date: new Date(Date.now() - 3600000 * 2).toISOString(), status: 'completed' },
                    { id: 'tx2', type: 'debit', from: 'TMT', to: 'external', amount: 150, description: 'Konserwa satyn almak', date: new Date(Date.now() - 3600000 * 5).toISOString(), status: 'completed' },
                    { id: 'tx3', type: 'credit', from: 'external', to: 'TMT', amount: 300, description: 'Aýlyk girdeji', date: new Date(Date.now() - 3600000 * 24).toISOString(), status: 'completed' },
                    { id: 'tx4', type: 'international', from: 'USD', to: 'EUR', amount: 100, description: 'Daşarky geçiriş', date: new Date(Date.now() - 3600000 * 48).toISOString(), status: 'pending' }
                ];
                saveTransactions();
            }

            const storedCards = localStorage.getItem(CARDS_KEY);
            if (storedCards) { try { cards = JSON.parse(storedCards); } catch(e) { cards = []; } }
            if (!cards || cards.length === 0) {
                cards = [
                    { id: 'c1', type: 'Visa', number: '**** 1234', expiry: '12/28', holder: user.username || 'User' },
                    { id: 'c2', type: 'Mastercard', number: '**** 5678', expiry: '06/27', holder: user.username || 'User' }
                ];
                saveCards();
            }

            generateBalanceHistory();
        }

        function saveWallets() { localStorage.setItem(WALLETS_KEY, JSON.stringify(wallets)); }
        function saveTransactions() { localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(transactions)); }
        function saveCards() { localStorage.setItem(CARDS_KEY, JSON.stringify(cards)); }

        function generateBalanceHistory() {
            balanceHistory = [];
            const now = Date.now();
            let total = getTotalBalance();
            for (let i = 6; i >= 0; i--) {
                const date = new Date(now - i * 24 * 3600000);
                const variation = (Math.random() - 0.5) * 200;
                const value = Math.max(0, total + variation);
                balanceHistory.push({ date: date.toISOString(), value: value });
            }
        }

        function getTotalBalance() {
            const rates = { TMT: 1, USD: 3.5, EUR: 3.8, RUB: 0.04 };
            return wallets.reduce((sum, w) => sum + (w.balance * (rates[w.currency] || 1)), 0);
        }

        function updateTotalBalance() {
            const total = getTotalBalance();
            document.getElementById('totalBalance').textContent = total.toFixed(2);
            if (balanceHistory.length > 0) {
                const last = balanceHistory[balanceHistory.length - 1].value;
                const newVal = total;
                if (Math.abs(newVal - last) > 0.01) {
                    balanceHistory.push({ date: new Date().toISOString(), value: newVal });
                    if (balanceHistory.length > 7) balanceHistory.shift();
                }
            }
            renderChart();
        }

        // ============================================================
        // 4. ГР АФРК
        // ============================================================
        function renderChart() {
            const ctx = document.getElementById('balanceChart').getContext('2d');
            if (chart) chart.destroy();
            const labels = balanceHistory.map(d => new Date(d.date).toLocaleDateString());
            const data = balanceHistory.map(d => d.value);
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Balans (TMT)',
                        data: data,
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0,212,255,0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#bdd0df' } } },
                    scales: {
                        x: { ticks: { color: '#9fb5c8', maxTicksLimit: 7 } },
                        y: { ticks: { color: '#9fb5c8' } }
                    }
                }
            });
        }

        // ============================================================
        // 5. Р­ФФЕКТ ПР ОЖЕКТОР А (SPOTLIGHT)
        // ============================================================
        function initSpotlightEffect() {
            document.querySelectorAll(".card-spotlight").forEach(card => {
                card.removeEventListener("mousemove", handleMouseMove);
                card.addEventListener("mousemove", handleMouseMove);
            });
        }

        function handleMouseMove(e) {
            const rect = this.getBoundingClientRect();
            this.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
            this.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
        }

        // ============================================================
        // 6. ОТР РСОВКА Р­ЛЕМЕНТОВ
        // ============================================================
        function renderWallets() {
            const container = document.getElementById('walletGrid');
            container.innerHTML = wallets.map(w => `
                <div class="wallet-item card-spotlight">
                    <div class="currency">${w.currency}</div>
                    <div class="amount">${w.balance.toFixed(2)}</div>
                </div>
            `).join('');
            initSpotlightEffect();
        }

        function renderTransactions() {
            const filter = document.getElementById('txFilter').value;
            let filtered = transactions;
            if (filter !== 'all') {
                filtered = transactions.filter(tx => tx.type === filter);
            }
            const list = document.getElementById('transactionsList');
            const empty = document.getElementById('emptyTx');
            if (!filtered.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
            list.innerHTML = sorted.map(tx => {
                const isCredit = tx.type === 'credit';
                const sign = isCredit ? '+' : '-';
                const amountClass = isCredit ? 'positive' : 'negative';
                const typeClass = tx.type;
                const typeLabel = tx.type.charAt(0).toUpperCase() + tx.type.slice(1);
                return `
                    <li>
                        <span>
                            <span class="tx-type ${typeClass}">${typeLabel}</span>
                            <span class="tx-description">${tx.description || ''}</span>
                        </span>
                        <span>
                            <span class="tx-amount ${amountClass}">${sign} ${Math.abs(tx.amount).toFixed(2)} ${tx.from}</span>
                            <span class="tx-date">${new Date(tx.date).toLocaleDateString()}</span>
                        </span>
                    </li>
                `;
            }).join('');
            initSpotlightEffect();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            if (!cards.length) {
                container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="icon">рџ’і</div><p>${tr('no_cards', 'Kartlar ýok')}</p></div>`;
                return;
            }
            container.innerHTML = cards.map(c => `
                <div class="card-spotlight" style="padding: 20px;">
                    <div style="font-size:12px; color:#00d4ff;">${c.type}</div>
                    <div style="font-size:20px; font-weight:600; margin:8px 0;">${c.number}</div>
                    <div style="font-size:14px; color:#bdd0df;">${c.holder}</div>
                    <div style="font-size:12px; color:#9fb5c8; margin-top: 8px;">${tr('card_expiry', 'Işleýän çenli')}: ${c.expiry}</div>
                </div>
            `).join('');
            initSpotlightEffect();
        }

        function updateQR() {
            const walletId = document.getElementById('walletId').textContent;
            const qrData = `TM Pay:${walletId}`;
            document.getElementById('qrDataText').textContent = qrData;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;
            document.getElementById('qrCodeImage').src = qrUrl;
        }

        // ============================================================
        // 7. ОБР АБОТЧРКР СОБЫТРЙ
        // ============================================================
        document.getElementById('txFilter').addEventListener('change', renderTransactions);

        document.getElementById('copyQrDataBtn').addEventListener('click', function() {
            const text = document.getElementById('qrDataText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('Kopiýalandy!', 'success');
            });
        });

        document.getElementById('transferForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const currency = document.getElementById('transferCurrency').value;
            const recipient = document.getElementById('recipientId').value.trim();
            const amount = parseFloat(document.getElementById('transferAmount').value);
            const desc = document.getElementById('transferDesc').value.trim();

            if (!recipient || !amount || amount <= 0) return showToast(tr('invalid_amount', 'Mukdar ýalňyş.'), 'error');
            const wallet = wallets.find(w => w.currency === currency);
            if (!wallet || wallet.balance < amount) return showToast(tr('insufficient', 'Balans ýeterlik däl.'), 'error');

            wallet.balance -= amount;
            saveWallets();

            transactions.push({
                id: 'tx' + Date.now(), type: 'transfer', from: currency, to: recipient,
                amount: amount, description: desc || 'Içki geçiriş', date: new Date().toISOString(), status: 'completed'
            });
            saveTransactions();

            updateTotalBalance(); renderWallets(); renderTransactions();
            showToast(tr('transfer_success', 'Geçiriş üstünlikli tamamlandy!'), 'success');
            this.reset();
        });

        document.getElementById('internationalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const currency = document.getElementById('intCurrency').value;
            const country = document.getElementById('intCountry').value.trim();
            const bank = document.getElementById('intBank').value.trim();
            const account = document.getElementById('intAccount').value.trim();
            const amount = parseFloat(document.getElementById('intAmount').value);
            const desc = document.getElementById('intDesc').value.trim();

            if (!country || !bank || !account || !amount || amount <= 0) return showToast(tr('invalid_amount', 'Mukdar ýalňyş.'), 'error');
            const wallet = wallets.find(w => w.currency === currency);
            if (!wallet || wallet.balance < amount) return showToast(tr('insufficient', 'Balans ýeterlik däl.'), 'error');

            wallet.balance -= amount;
            saveWallets();

            transactions.push({
                id: 'tx' + Date.now(), type: 'international', from: currency, to: `${country}, ${bank}`,
                amount: amount, description: desc || 'Daşarky geçiriş', date: new Date().toISOString(), status: 'pending'
            });
            saveTransactions();

            updateTotalBalance(); renderWallets(); renderTransactions();
            showToast(tr('transfer_success', 'Geçiriş üstünlikli tamamlandy!'), 'success');
            this.reset();
        });

        document.getElementById('addCardBtn').addEventListener('click', function() {
            const newCard = {
                id: 'c' + Date.now(), type: 'Visa',
                number: '**** ' + Math.floor(1000 + Math.random() * 9000),
                expiry: '12/' + (new Date().getFullYear() + 3).toString().slice(-2),
                holder: user.username || 'User'
            };
            cards.push(newCard);
            saveCards(); renderCards();
            showToast('Täze kart goşuldy!', 'success');
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            renderWallets(); renderTransactions(); renderCards();
            updateTotalBalance(); updateQR();
            showToast('Täzelendi!', 'success');
        });

        document.querySelectorAll('.doc-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.doc-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');
                if (tab === 'history') renderTransactions();
                if (tab === 'cards') renderCards();
                if (tab === 'receive') updateQR();
            });
        });

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.5s'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        // ============================================================
        // 8. ФОН Р ЧАСТРЦЫ
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const particlesContainer = document.getElementById("particles");
            if (particlesContainer) {
                particlesContainer.innerHTML = "";
                const colors = ['#00d4ff', '#00ffa3', '#1f6bff', '#ffffff'];
                for (let i = 0; i < 65; i++) {
                    const particle = document.createElement("div");
                    particle.className = "particle";
                    const size = Math.random() * 2.2 + 1.0; 
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.width = size + "px";
                    particle.style.height = size + "px";
                    particle.style.backgroundColor = color;
                    particle.style.boxShadow = `0 0 ${size * 3}px ${color}`;
                    particle.style.left = (Math.random() * 92 + 4) + "%";
                    particle.style.top = "0px";
                    particle.style.animationDuration = (10 + Math.random() * 12) + "s";
                    particle.style.animationDelay = (Math.random() * -20) + "s";
                    particlesContainer.appendChild(particle);
                }
            }

            const canvas = document.getElementById('bgCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let w, h;
                function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
                resize();
                window.addEventListener('resize', resize);
                const points = Array.from({ length: 60 }, () => ({
                    x: Math.random() * (w - 45) + 20, y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                    radius: Math.random() * 1.2 + 0.8
                }));
                function drawCanvas() {
                    ctx.clearRect(0, 0, w, h);
                    for (let i = 0; i < points.length; i++) {
                        let p = points[i];
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 20 || p.x > w - 25) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;
                        for (let j = i + 1; j < points.length; j++) {
                            let p2 = points[j];
                            let dx = p.x - p2.x, dy = p.y - p2.y;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 180) {
                                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = `rgba(0, 212, 255, ${0.18 * (1 - dist / 180)})`;
                                ctx.lineWidth = 1; ctx.stroke();
                            }
                        }
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 255, 163, 0.85)'; ctx.shadowBlur = 6; ctx.shadowColor = '#00ffa3';
                        ctx.fill(); ctx.shadowBlur = 0;
                    }
                    requestAnimationFrame(drawCanvas);
                }
                drawCanvas();
            }

            // Рнициализация
            loadData();
            updateTotalBalance();
            renderWallets();
            renderTransactions();
            renderCards();
            updateQR();
            renderChart();
            initSpotlightEffect();
            console.log('вњ… TM Pay loaded');
        });
    </script>
</body>
